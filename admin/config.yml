backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "General Info"
        name: "general"
        fields:
          - { label: "Hero Eyebrow (small line above title)", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero Title", name: "hero_title", widget: "text" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "Hero Background Image", name: "hero_bg_image", widget: "image" }
          - { label: "Phone (display)", name: "phone", widget: "string" }
          - { label: "Phone (digits only, for tap-to-call)", name: "phone_link", widget: "string" }
          - { label: "Rating", name: "rating", widget: "string" }
          - { label: "Review Count", name: "reviews", widget: "string" }
          - { label: "Price Per Person", name: "price", widget: "string" }
          - { label: "Price Note", name: "price_note", widget: "string" }
          - { label: "Hours Note (top strip)", name: "hours_note", widget: "string" }
          - { label: "About Heading", name: "about_heading", widget: "string" }
          - { label: "About Paragraph 1", name: "about_text_1", widget: "text" }
          - { label: "About Paragraph 2", name: "about_text_2", widget: "text" }
          - { label: "About Section Image", name: "about_image", widget: "image" }
          - label: "Weekly Hours"
            name: "hours"
            widget: "list"
            fields:
              - { label: "Days", name: "days", widget: "string" }
              - { label: "Time", name: "time", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Google Maps Embed URL (from Maps > Share > Embed)", name: "map_embed_url", widget: "string" }
          - { label: "Web3Forms Access Key (get free at web3forms.com)", name: "web3forms_key", widget: "string" }

  - name: "menu"
    label: "Menu"
    files:
      - file: "content/menu.json"
        label: "Full Menu"
        name: "menu_data"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Category Name", name: "name", widget: "string" }
              - { label: "Slug (no spaces, used as the page anchor)", name: "slug", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{name}} — {{price}}"
                fields:
                  - { label: "Item Name", name: "name", widget: "string" }
                  - { label: "Tag (optional, e.g. \"Dry\" or \"250ml\")", name: "tag", widget: "string", required: false }
                  - { label: "Price", name: "price", widget: "string" }
                  - { label: "Available", name: "available", widget: "boolean", default: true }

  - name: "gallery"
    label: "Gallery"
    files:
      - file: "content/gallery.json"
        label: "Photo Gallery"
        name: "gallery_data"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "src", widget: "image" }
              - { label: "Caption / Alt Text", name: "caption", widget: "string" }
